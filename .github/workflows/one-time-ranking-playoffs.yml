name: One-time app_config last playoff patch

on:
  push:
    branches:
      - fase2-playoffs
    paths:
      - scripts/patch-app-config-last.cjs
      - .github/workflows/one-time-ranking-playoffs.yml

permissions:
  contents: write

jobs:
  patch-app-config-last:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fase2-playoffs
          fetch-depth: 0

      - name: Mover app_config al ultimo paso
        run: node scripts/patch-app-config-last.cjs

      - name: Commit del cambio
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/playoffTransition.ts
          git diff --cached --quiet && exit 0
          git commit -m "fix: dejar app_config como ultimo paso en playoffs"
          git push origin HEAD:fase2-playoffs
