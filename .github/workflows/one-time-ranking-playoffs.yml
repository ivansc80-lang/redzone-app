name: One-time ranking playoffs patch

on:
  push:
    branches:
      - fase2-playoffs
    paths:
      - scripts/patch-ranking-playoffs.cjs
      - .github/workflows/one-time-ranking-playoffs.yml

permissions:
  contents: write

jobs:
  patch-ranking:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fase2-playoffs
          fetch-depth: 0

      - name: Aplicar parche
        run: node scripts/patch-ranking-playoffs.cjs

      - name: Commit del cambio
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/page.tsx
          git diff --cached --quiet && exit 0
          git commit -m "fix: hacer ranking dinámico con playoffs"
          git push origin HEAD:fase2-playoffs
