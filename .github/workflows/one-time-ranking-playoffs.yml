name: One-time phase 2 patch

on:
  push:
    branches:
      - fase2-playoffs
    paths:
      - scripts/patch-ranking-playoffs.cjs
      - .github/workflows/one-time-ranking-playoffs.yml

permissions:
  contents: write

jobs:
  patch-phase-2:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fase2-playoffs
          fetch-depth: 0

      - name: Aplicar correcciones finales FASE 2
        run: node scripts/patch-ranking-playoffs.cjs

      - name: Commit del cambio
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/pushAutomatic.ts lib/playoffTransition.ts lib/syncCalendar.ts app/api/sync-current-week/route.ts
          git diff --cached --quiet && exit 0
          git commit -m "fix: cerrar reintentos y temporada en transiciones playoffs"
          git push origin HEAD:fase2-playoffs
