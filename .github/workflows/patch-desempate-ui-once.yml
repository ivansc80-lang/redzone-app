name: Patch temporada dinamica desempate once

on:
  push:
    branches:
      - fase2-playoffs
    paths:
      - .github/workflows/patch-desempate-ui-once.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fase2-playoffs
          fetch-depth: 0

      - name: Sustituir temporada fija solo en flujo Super Bowl/desempate
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('app/page.tsx')
          s = path.read_text()

          targets = [
              ('desempate_superbowl_estado', 2),
              ('desempates_superbowl', 2),
              ('elecciones_superbowl', 2),
          ]

          total = 0
          for table, expected in targets:
              marker = f'.from("{table}")'
              pos = 0
              changed = 0
              while True:
                  start = s.find(marker, pos)
                  if start == -1:
                      break
                  end = s.find('.maybeSingle()', start)
                  order_end = s.find('.order(', start)
                  if end == -1 or (order_end != -1 and order_end < end):
                      end = order_end
                  if end == -1:
                      end = min(len(s), start + 800)
                  block = s[start:end]
                  old = '.eq("temporada", 2026)'
                  if old in block:
                      absolute = start + block.index(old)
                      s = s[:absolute] + '.eq("temporada", temporadaRegular)' + s[absolute + len(old):]
                      changed += 1
                      total += 1
                      pos = absolute + len('.eq("temporada", temporadaRegular)')
                  else:
                      pos = start + len(marker)
              if changed != expected:
                  raise SystemExit(f'{table}: esperadas {expected} sustituciones, hechas {changed}')

          if total != 6:
              raise SystemExit(f'Esperadas 6 sustituciones totales, hechas {total}')

          path.write_text(s)
          PY

      - name: Verificar build
        run: npm ci && npm run build

      - name: Commit del cambio y retirada del workflow temporal
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/patch-desempate-ui-once.yml
          git add app/page.tsx
          git commit -m "TEST: usar temporada activa en desempate Super Bowl"
          git push origin HEAD:fase2-playoffs
